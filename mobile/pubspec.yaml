name: christimony
description: "Christimony — a Christian matrimony app. Mobile client (Flutter)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1

  # Networking
  dio: ^5.11.1

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5

  # Media
  cached_network_image: ^4.0.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # Realtime transport (ActionCable client is hand-rolled on top of this)
  web_socket_channel: ^3.0.3

  # Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

  # Push notifications
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Deep links
  app_links: ^7.2.1

  # Utilities
  intl: ^0.20.3
  phone_numbers_parser: ^9.0.26
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lints
  very_good_analysis: ^11.0.0
  riverpod_lint: ^3.1.9

  # Codegen
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

  # Testing
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  alchemist: ^0.14.0
  patrol: ^4.9.0

  # App icons / splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  assets:
    - assets/images/
