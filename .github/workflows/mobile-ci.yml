name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code (freezed / json_serializable / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fail if generated code is not committed
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Enforce feature isolation and Dio containment
        run: ./tool/check_isolation.sh

      - name: Run tests
        run: flutter test --coverage

      - name: Build debug APK (toolchain smoke test)
        run: flutter build apk --debug
