test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage for production. Works with real AWS S3 or
# Cloudflare R2 (cheaper egress) -- for R2, set S3_ENDPOINT to your R2
# account endpoint and leave S3_REGION as "auto". Configure via ENV so no
# credentials need to be checked in:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET, S3_REGION, [S3_ENDPOINT]
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "auto") %>
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  <% if ENV["S3_ENDPOINT"].present? %>
  force_path_style: true
  <% end %>
